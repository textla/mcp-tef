name: CLI Code Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: CLI ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format check
            task: format
          - name: Lint
            task: lint
          - name: Type check
            task: typecheck
          - name: Tests
            task: test:cli:unit
          - name: Security scanning
            task: security:cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x

      - name: Install dependencies
        run: |
          task install
          task install:cli

      - name: Run CLI ${{ matrix.name }}
        run: task ${{ matrix.task }}
